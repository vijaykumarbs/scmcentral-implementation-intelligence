[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scmcentral-implementation-intelligence"
version = "0.1.0"
description = "A provider-agnostic toolkit for intelligent implementation data preparation and validation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "Vijay Kumar" }
]
dependencies = []

[project.scripts]
implementation-intelligence = "implementation_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
